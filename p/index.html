<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Remember That Thing</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #fff; color: #17181C; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
        a { color: #17181C; font-weight: 700; }
    </style>
</head>
<body>
<p><a id="store" href="https://play.google.com/store/apps/details?id=com.manikogames.rememberthatthing">Remember That Thing</a></p>
<script>
    // A product link: https://maniko.games/p/?t=<token>. On an Android phone that has the app, the app opens the link
    // itself (Android App Link) and this page is never shown. Here we only land when the app is not installed
    // (or on a computer): straight to the app page in Google Play.
    window.location.replace(document.getElementById('store').href);
</script>
</body>
</html>
