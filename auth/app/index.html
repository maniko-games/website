<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Returning to the app | Maniko Games</title>
    <style>
        :root { --text: #1f2937; --bg: #ffffff; --accent: #2563eb; }
        @media (prefers-color-scheme: dark) { :root { --text: #e5e7eb; --bg: #111827; --accent: #60a5fa; } }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
        a.button { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
        a.button[hidden] { display: none; }
        p { color: inherit; opacity: 0.8; }
    </style>
</head>
<body>
<main>
    <h1>Returning to the app…</h1>
    <p id="text">If nothing happens, tap the button.</p>
    <a id="open" class="button" href="#" hidden>Open the app</a>
</main>
<script>
    // The sign-in service sends people here after they sign in (for example with Google). The sign-in details are in
    // the part of the address after "#", which the browser never sends to any server. This page only passes
    // everything on to the app, and only to the app's own address schemes.
    (function () {
        var params = new URLSearchParams(window.location.search);
        var back = params.get('return') || '';
        params.delete('return');
        var allowed = /^(exp|exps|rememberthatthing):\/\//i.test(back);
        if (!allowed) {
            document.getElementById('text').textContent = 'Nothing to open here. You can close this page.';
            return;
        }
        var rest = params.toString();
        var target = back + (rest ? (back.indexOf('?') >= 0 ? '&' : '?') + rest : '') + window.location.hash;
        var open = document.getElementById('open');
        open.href = target;
        open.hidden = false;
        window.location.replace(target);
    })();
</script>
</body>
</html>
